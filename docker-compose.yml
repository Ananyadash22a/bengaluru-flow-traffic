services:
  mysql:
    image: mysql:8.4
    container_name: bengaluruflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bengaluruflow
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment}
    ports:
      - "3306:3306"
    volumes:
      - bengaluruflow-mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 4s
      retries: 15

volumes:
  bengaluruflow-mysql:
