spring.application.name=BengaluruFlowApi
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bengaluruflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:local-only-change-me-bengaluruflow-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
springdoc.swagger-ui.path=/swagger-ui.html
